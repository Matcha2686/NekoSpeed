
name: Build NekoSpeed Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout NekoSpeed source
        uses: actions/checkout@v4
        with:
          repository: KaWaIDeSuNe/NekoSpeed
          ref: 39f6e970cd25356b5fd80132196cffdb1c5c1920

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true

      - name: Build Windows AMD64
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -mod=readonly -trimpath -ldflags '-s -w' -o nekospeed-windows-amd64.exe ./cmd/nekospeed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NekoSpeed-Windows-x64-v0.2.1
          path: nekospeed-windows-amd64.exe
          if-no-files-found: error
